name: Release

# Two ways to release – the tag must match the version in cli/pyproject.toml
# (single source: __version__ in cli/agentbox_cli/__init__.py, checked by .github/scripts/check-version.sh):
#   - push a tag like v0.2.0 (the release is created here), or
#   - publish a release on github.com with a new tag v0.2.0 (your text is kept and completed here).
#
# Flow: the release is switched to pre-release first, then the image is built and pushed, the
# versioned wrapper attached and the notes completed. Only at the very end it becomes the latest
# release. If anything fails, it stays a pre-release. Versions with a dash (v0.2.0-rc.1) stay
# pre-releases.
# Notes = your text + CHANGELOG section + install block + GitHub's PR list
# (see .github/scripts/release-notes.sh).
on:
  push:
    tags: ["v*.*.*"]
  release:
    types: [published]

# A release published in the web UI can also fire the tag push; never run two at once.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/redrem95/agentbox
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    name: Mark as pre-release
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.mark.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
      - id: mark
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            author=$(gh release view "$tag" --json author --jq .author.login)
            if [ "$GITHUB_EVENT_NAME" = push ] && [ "$author" != "github-actions[bot]" ]; then
              echo "Release $tag was created on github.com – the release event run takes care of it."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            gh release edit "$tag" --prerelease
          else
            gh release create "$tag" --verify-tag --prerelease --title "agentbox ${tag#v}" \
              --notes "<!-- agentbox:placeholder -->
          Build is running, this text is replaced when it is done."
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

  release:
    name: Build and publish
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # previous tag for the generated notes

      - name: Check version
        # tag must be semver and match the version in cli/pyproject.toml, otherwise stop here
        run: |
          version=$(.github/scripts/check-version.sh "$GITHUB_REF_NAME")
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=agentbox
            org.opencontainers.image.description=herdr server, coding agents, repos and toolchains from one config
            org.opencontainers.image.licenses=MIT

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attach versioned wrapper
        run: |
          mkdir -p dist
          sed "s/^AGENTBOX_VERSION=\"dev\"$/AGENTBOX_VERSION=\"$VERSION\"/" agentbox > dist/agentbox
          grep -q "^AGENTBOX_VERSION=\"$VERSION\"$" dist/agentbox
          chmod +x dist/agentbox
          gh release upload "$GITHUB_REF_NAME" dist/agentbox --clobber

      - name: Complete release notes
        run: |
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" --json body --jq .body > existing.md
          EXISTING_NOTES=existing.md .github/scripts/release-notes.sh "$VERSION" "$tag" "$GITHUB_REPOSITORY" "$IMAGE" > notes.md
          cat notes.md
          # keep a title written in the web UI, otherwise use ours
          title=$(gh release view "$tag" --json name --jq .name)
          if [ -z "$title" ] || [ "$title" = "$tag" ]; then title="agentbox $VERSION"; fi
          gh release edit "$tag" --notes-file notes.md --title "$title"

      - name: Mark as latest release
        run: |
          case "$VERSION" in
            *-*) echo "$VERSION is a pre-release version – stays a pre-release." ;;
            *)   gh release edit "$GITHUB_REF_NAME" --prerelease=false --latest ;;
          esac
