name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck -S warning agentbox image/*.sh .github/scripts/*.sh
      - uses: astral-sh/setup-uv@v7
      - name: ruff
        run: uvx ruff check cli
      - name: Release version check works
        # same script as the release workflow, against the current version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' cli/agentbox_cli/__init__.py)
          .github/scripts/check-version.sh "v$version"

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - name: pytest
        run: |
          uv venv
          uv pip install "./cli[test]"
          uv run --no-project pytest cli/tests -q

  image:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: agentbox:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --rm --entrypoint agentbox-cli agentbox:ci --version
          docker run --rm --entrypoint herdr agentbox:ci --version
          docker run --rm --entrypoint bash agentbox:ci -c 'yq --version && gh --version && docker compose version && jq --version'
