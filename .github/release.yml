# Categories for GitHub's generated release notes (used by .github/scripts/release-notes.sh)
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Features
      labels: [enhancement, feature]
    - title: Fixes
      labels: [bug, fix]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
