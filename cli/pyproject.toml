[project]
name = "agentbox"
dynamic = ["version"]   # single source: __version__ in agentbox_cli/__init__.py
description = "Disposable dev boxes for coding agents: repos, toolchains, herdr and Android emulators from one YAML"
requires-python = ">=3.11"
dependencies = ["ruamel.yaml>=0.17"]

[project.scripts]
agentbox = "agentbox_cli.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agentbox_cli"]

[tool.setuptools.dynamic]
version = { attr = "agentbox_cli.__version__" }

[project.optional-dependencies]
test = ["pytest>=8", "packaging"]

[tool.ruff]
line-length = 135
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
